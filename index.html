<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dobókocka</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --accent: #d64545;
    --accent-dark: #b23434;
    --die-bg: #ffffff;
    --die-border: #1f2430;
    --pip: #1f2430;
    --shadow: rgba(31, 36, 48, 0.15);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --card: #1f2229;
      --ink: #f1f1f1;
      --muted: #9aa0ab;
      --accent: #e6584f;
      --accent-dark: #c2453d;
      --die-bg: #2a2d36;
      --die-border: #e8e8e8;
      --pip: #f1f1f1;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin: 0 0 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px var(--shadow);
    margin-bottom: 20px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }

  .controls label {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .count-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .count-control button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    color: var(--ink);
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .count-control button:active {
    transform: scale(0.92);
  }

  .count-control input[type="number"] {
    width: 52px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 6px 4px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    color: var(--ink);
  }

  input[type="range"] {
    width: 100%;
    margin-top: 10px;
    accent-color: var(--accent);
  }

  .dice-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    min-height: 84px;
    margin-bottom: 8px;
  }

  .die {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    background: var(--die-bg);
    border: 1px solid var(--die-border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    padding: 10px;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform 0.15s ease;
  }

  .die.rolling {
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--pip);
    align-self: center;
    justify-self: center;
    opacity: 0;
  }

  .roll-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .roll-btn:hover { background: var(--accent-dark); }
  .roll-btn:active { transform: scale(0.98); }

  .mode-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 4px;
  }

  .mode-options label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    cursor: pointer;
    font-size: 0.92rem;
  }

  .mode-options input[type="radio"] {
    accent-color: var(--accent);
  }

  .practice-box {
    display: none;
    margin-top: 18px;
    text-align: center;
  }

  .practice-box.active {
    display: block;
  }

  .practice-box .question {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option-btn {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    color: var(--ink);
    font-weight: 700;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-btn.correct {
    background: #2f9e44;
    border-color: #2f9e44;
    color: #fff;
  }

  .option-btn.wrong {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .feedback {
    margin-top: 12px;
    font-size: 1rem;
    font-weight: 700;
    min-height: 1.4em;
  }

  .feedback.correct { color: #2f9e44; }
  .feedback.wrong { color: var(--accent); }

  .next-btn {
    display: none;
    margin: 14px auto 0;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .next-btn.active {
    display: inline-block;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🎲 Dobókocka</h1>
    <p class="subtitle">Állítsd be, hány kockával dobsz, aztán dobj!</p>

    <div class="card">
      <div class="controls">
        <label for="diceCount">Kockák száma</label>
        <div class="count-control">
          <button type="button" id="decreaseBtn" aria-label="Kevesebb kocka">−</button>
          <input type="number" id="diceCount" min="1" max="12" value="2">
          <button type="button" id="increaseBtn" aria-label="Több kocka">+</button>
        </div>
      </div>
      <input type="range" id="diceSlider" min="1" max="12" value="2">

      <div class="controls" style="margin-top: 18px; margin-bottom: 0;">
        <label>Gyakorlás</label>
      </div>
      <div class="mode-options">
        <label><input type="radio" name="mode" value="none" checked> Nincs, csak dobás</label>
        <label><input type="radio" name="mode" value="add"> Összeadás</label>
        <label><input type="radio" name="mode" value="sub"> Kivonás</label>
      </div>
    </div>

    <div class="card">
      <div class="dice-tray" id="diceTray"></div>
      <button class="roll-btn" id="rollBtn">Dobás!</button>

      <div class="practice-box" id="practiceBox">
        <div class="question" id="question"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="feedback" id="feedback"></div>
        <button type="button" class="next-btn" id="nextBtn">Következő →</button>
      </div>
    </div>

    <footer>Kattints a “Dobás!” gombra, vagy nyomj szóközt. Gyakorlás módban kattints a szerinted helyes eredményre.</footer>
  </div>

<script>
  const diceCountInput = document.getElementById('diceCount');
  const diceSlider = document.getElementById('diceSlider');
  const diceTray = document.getElementById('diceTray');
  const rollBtn = document.getElementById('rollBtn');
  const decreaseBtn = document.getElementById('decreaseBtn');
  const increaseBtn = document.getElementById('increaseBtn');
  const modeInputs = document.querySelectorAll('input[name="mode"]');
  const practiceBox = document.getElementById('practiceBox');
  const questionEl = document.getElementById('question');
  const optionsGrid = document.getElementById('optionsGrid');
  const feedbackEl = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');

  const MIN_DICE = 1;
  const MAX_DICE = 12;

  let currentValues = [];
  let currentAnswer = null;
  let answered = false;

  function getMode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  const pipLayouts = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  function clamp(value) {
    value = Math.max(MIN_DICE, Math.min(MAX_DICE, value));
    return value;
  }

  function setDiceCount(value, source) {
    value = clamp(parseInt(value, 10) || MIN_DICE);
    diceCountInput.value = value;
    diceSlider.value = value;
    renderTray(value);
  }

  function renderTray(count) {
    diceTray.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const die = document.createElement('div');
      die.className = 'die';
      die.dataset.index = i;
      for (let p = 1; p <= 9; p++) {
        const pip = document.createElement('span');
        pip.className = 'pip';
        die.appendChild(pip);
      }
      diceTray.appendChild(die);
    }
  }

  function showFace(dieEl, face) {
    const pips = dieEl.querySelectorAll('.pip');
    pips.forEach(p => p.style.opacity = 0);
    pipLayouts[face].forEach(idx => {
      pips[idx - 1].style.opacity = 1;
    });
  }

  function roll() {
    const dice = diceTray.querySelectorAll('.die');
    const values = [];

    dice.forEach(die => {
      die.classList.add('rolling');
      setTimeout(() => die.classList.remove('rolling'), 400);
    });

    dice.forEach(die => {
      const face = Math.floor(Math.random() * 6) + 1;
      values.push(face);
      showFace(die, face);
    });

    currentValues = values;
    const mode = getMode();

    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    optionsGrid.innerHTML = '';
    nextBtn.classList.remove('active');
    answered = false;

    if (mode === 'none') {
      practiceBox.classList.remove('active');
      return;
    }

    if (mode === 'add') {
      currentAnswer = values.reduce((a, b) => a + b, 0);
      questionEl.textContent = values.length > 1
        ? `Mennyi ${values.join(' + ')}?`
        : `Mennyi ${values[0]}?`;
    } else {
      const sorted = [...values].sort((a, b) => b - a);
      currentAnswer = sorted.reduce((a, b) => a - b);
      questionEl.textContent = sorted.length > 1
        ? `Mennyi ${sorted.join(' - ')}?`
        : `Mennyi ${sorted[0]}?`;
    }

    practiceBox.classList.add('active');
    renderOptions(currentAnswer);
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function renderOptions(correct) {
    const options = new Set([correct]);
    let guardCount = 0;

    while (options.size < 4 && guardCount < 100) {
      guardCount++;
      const offset = Math.floor(Math.random() * 6) + 1; // 1..6
      const candidate = correct + (Math.random() < 0.5 ? -offset : offset);
      if (candidate >= 0 && candidate !== correct) {
        options.add(candidate);
      }
    }

    shuffle(Array.from(options)).forEach(value => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn';
      btn.textContent = value;
      btn.addEventListener('click', () => selectAnswer(btn, value));
      optionsGrid.appendChild(btn);
    });
  }

  function selectAnswer(btn, value) {
    if (currentAnswer === null || answered) return;
    answered = true;

    const allButtons = optionsGrid.querySelectorAll('.option-btn');
    allButtons.forEach(b => b.disabled = true);

    if (value === currentAnswer) {
      btn.classList.add('correct');
      feedbackEl.textContent = '✅ Ügyes vagy, ez helyes!';
      feedbackEl.className = 'feedback correct';
    } else {
      btn.classList.add('wrong');
      allButtons.forEach(b => {
        if (parseInt(b.textContent, 10) === currentAnswer) {
          b.classList.add('correct');
        }
      });
      feedbackEl.textContent = `❌ Még nem az, a helyes válasz: ${currentAnswer}`;
      feedbackEl.className = 'feedback wrong';
      nextBtn.classList.add('active');
    }
  }

  diceCountInput.addEventListener('input', () => setDiceCount(diceCountInput.value));
  diceCountInput.addEventListener('blur', () => setDiceCount(diceCountInput.value || MIN_DICE));
  diceSlider.addEventListener('input', () => setDiceCount(diceSlider.value));

  decreaseBtn.addEventListener('click', () => setDiceCount((parseInt(diceCountInput.value, 10) || MIN_DICE) - 1));
  increaseBtn.addEventListener('click', () => setDiceCount((parseInt(diceCountInput.value, 10) || MIN_DICE) + 1));

  rollBtn.addEventListener('click', roll);
  nextBtn.addEventListener('click', roll);

  modeInputs.forEach(input => {
    input.addEventListener('change', () => {
      practiceBox.classList.remove('active');
      optionsGrid.innerHTML = '';
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      roll();
    }
  });

  setDiceCount(2);
</script>
</body>
</html>
