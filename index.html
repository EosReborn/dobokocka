<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dobókocka</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --accent: #d64545;
    --accent-dark: #b23434;
    --die-bg: #ffffff;
    --die-border: #1f2430;
    --pip: #1f2430;
    --shadow: rgba(31, 36, 48, 0.15);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --card: #1f2229;
      --ink: #f1f1f1;
      --muted: #9aa0ab;
      --accent: #e6584f;
      --accent-dark: #c2453d;
      --die-bg: #2a2d36;
      --die-border: #e8e8e8;
      --pip: #f1f1f1;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin: 0 0 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px var(--shadow);
    margin-bottom: 20px;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }

  .controls label {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .count-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .count-control button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    color: var(--ink);
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .count-control button:active {
    transform: scale(0.92);
  }

  .count-control input[type="number"] {
    width: 52px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 6px 4px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    color: var(--ink);
  }

  input[type="range"] {
    width: 100%;
    margin-top: 10px;
    accent-color: var(--accent);
  }

  .dice-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    min-height: 84px;
    margin-bottom: 8px;
  }

  .die {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    background: var(--die-bg);
    border: 1px solid var(--die-border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    padding: 10px;
    box-shadow: 0 4px 10px var(--shadow);
    transition: transform 0.15s ease;
  }

  .die.rolling {
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--pip);
    align-self: center;
    justify-self: center;
    opacity: 0;
  }

  .roll-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .roll-btn:hover { background: var(--accent-dark); }
  .roll-btn:active { transform: scale(0.98); }

  .result {
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .result strong {
    color: var(--ink);
    font-size: 1.15rem;
  }

  .mode-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 4px;
  }

  .mode-options label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    cursor: pointer;
    font-size: 0.92rem;
  }

  .mode-options input[type="radio"] {
    accent-color: var(--accent);
  }

  .practice-box {
    display: none;
    margin-top: 18px;
    text-align: center;
  }

  .practice-box.active {
    display: block;
  }

  .practice-box .question {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .answer-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  .answer-row input[type="number"] {
    width: 90px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--die-border);
    background: var(--die-bg);
    color: var(--ink);
  }

  .answer-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .answer-row button:hover {
    background: var(--accent-dark);
  }

  .feedback {
    margin-top: 12px;
    font-size: 1rem;
    font-weight: 700;
    min-height: 1.4em;
  }

  .feedback.correct { color: #2f9e44; }
  .feedback.wrong { color: var(--accent); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🎲 Dobókocka</h1>
    <p class="subtitle">Állítsd be, hány kockával dobsz, aztán dobj!</p>

    <div class="card">
      <div class="controls">
        <label for="diceCount">Kockák száma</label>
        <div class="count-control">
          <button type="button" id="decreaseBtn" aria-label="Kevesebb kocka">−</button>
          <input type="number" id="diceCount" min="1" max="12" value="2">
          <button type="button" id="increaseBtn" aria-label="Több kocka">+</button>
        </div>
      </div>
      <input type="range" id="diceSlider" min="1" max="12" value="2">
    </div>

    <div class="card">
      <div class="dice-tray" id="diceTray"></div>
      <button class="roll-btn" id="rollBtn">Dobás!</button>
      <div class="result" id="result"></div>
    </div>

    <footer>Kattints a “Dobás!” gombra, vagy nyomj szóközt / Entert.</footer>
  </div>

<script>
  const diceCountInput = document.getElementById('diceCount');
  const diceSlider = document.getElementById('diceSlider');
  const diceTray = document.getElementById('diceTray');
  const rollBtn = document.getElementById('rollBtn');
  const resultEl = document.getElementById('result');
  const decreaseBtn = document.getElementById('decreaseBtn');
  const increaseBtn = document.getElementById('increaseBtn');

  const MIN_DICE = 1;
  const MAX_DICE = 12;

  const pipLayouts = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };

  function clamp(value) {
    value = Math.max(MIN_DICE, Math.min(MAX_DICE, value));
    return value;
  }

  function setDiceCount(value, source) {
    value = clamp(parseInt(value, 10) || MIN_DICE);
    diceCountInput.value = value;
    diceSlider.value = value;
    renderTray(value);
  }

  function renderTray(count) {
    diceTray.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const die = document.createElement('div');
      die.className = 'die';
      die.dataset.index = i;
      for (let p = 1; p <= 9; p++) {
        const pip = document.createElement('span');
        pip.className = 'pip';
        die.appendChild(pip);
      }
      diceTray.appendChild(die);
    }
    resultEl.textContent = '';
  }

  function showFace(dieEl, face) {
    const pips = dieEl.querySelectorAll('.pip');
    pips.forEach(p => p.style.opacity = 0);
    pipLayouts[face].forEach(idx => {
      pips[idx - 1].style.opacity = 1;
    });
  }

  function roll() {
    const dice = diceTray.querySelectorAll('.die');
    const values = [];

    dice.forEach(die => {
      die.classList.add('rolling');
      setTimeout(() => die.classList.remove('rolling'), 400);
    });

    dice.forEach(die => {
      const face = Math.floor(Math.random() * 6) + 1;
      values.push(face);
      showFace(die, face);
    });

    const sum = values.reduce((a, b) => a + b, 0);
    resultEl.innerHTML = values.length > 1
      ? `Dobott értékek: <strong>${values.join(', ')}</strong> — Összeg: <strong>${sum}</strong>`
      : `Dobott érték: <strong>${sum}</strong>`;
  }

  diceCountInput.addEventListener('input', () => setDiceCount(diceCountInput.value));
  diceCountInput.addEventListener('blur', () => setDiceCount(diceCountInput.value || MIN_DICE));
  diceSlider.addEventListener('input', () => setDiceCount(diceSlider.value));

  decreaseBtn.addEventListener('click', () => setDiceCount((parseInt(diceCountInput.value, 10) || MIN_DICE) - 1));
  increaseBtn.addEventListener('click', () => setDiceCount((parseInt(diceCountInput.value, 10) || MIN_DICE) + 1));

  rollBtn.addEventListener('click', roll);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      roll();
    }
  });

  setDiceCount(2);
</script>
</body>
</html>
